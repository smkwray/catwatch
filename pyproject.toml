[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencatwatch"
version = "0.1.0"
description = "Evidence-first public-data starter project for catastrophe bond tracking"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "OpenCatWatch contributors"}]
license = {text = "MIT"}
dependencies = [
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "typer>=0.12.5",
  "python-dotenv>=1.0.1",
  "polars>=1.12.0",
  "duckdb>=1.1.3",
  "pydantic>=2.9.2",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.2",
  "mypy>=1.13.0",
]

[project.scripts]
opencatwatch = "opencatwatch.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/catwatch-pytest-cache"
addopts = [
  "-q",
  "--ignore-glob",
  "*sync-conflict*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "/tmp/catwatch-ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
